<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoIt — Session Expired</title>
  <link rel="stylesheet" href="../CSS/sessionExpired.css" />
</head>

<body>

  <div class="page">

    <!-- RED HEADER -->
    <div class="hero-header">
      <div class="top-bar">
        <button class="icon-btn" id="backBtn" aria-label="Go back">
          <img src="../images/icons/left-arrow.svg" alt="back" />
        </button>
        <span class="page-title">Session expired</span>
      </div>
    </div>

    <!-- ERROR BODY -->
    <div class="error-body">

      <!-- Session / clock icon -->
      <div class="error-icon">
        <img src="../images/icons/session.svg" alt="session expired" />
      </div>

      <!-- Title & description -->
      <h1 class="error-title">Session expired</h1>
      <p class="error-subtitle">
        Your session has timed out for security.
        Please log in again to continue.
      </p>

    </div>

  </div>

  <script src="../Javascript/sessionExpired.js"></script>

</body>
</html>
