<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoIt — Page Not Found</title>
  <link rel="stylesheet" href="../CSS/404error.css" />
</head>

<body>

  <div class="page-card">

    <!-- RED HEADER -->
    <div class="hero-header">
      <div class="top-bar">
        <button class="icon-btn" id="backBtn" aria-label="Go back">
          <img src="../images/icons/left-arrow.svg" alt="back" />
        </button>
        <span class="page-title">Page not found</span>
      </div>
    </div>

    <!-- ERROR BODY -->
    <div class="error-body">

      <!-- X circle icon -->
      <div class="error-icon">
        <img src="../images/icons/404 cross.svg" alt="error" />
      </div>

      <!-- 404 number — middle 0 is light -->
      <div class="error-code">
        <span class="code-dark">4</span>
        <span class="code-light">0</span>
        <span class="code-dark">4</span>
      </div>

      <!-- Title & description -->
      <h1 class="error-title">Page not found</h1>
      <p class="error-subtitle">
        Oops! The page you're looking for
        doesn't exist or has been moved.
      </p>

    </div>

  </div>

  <script src="../Javascript/404error.js"></script>

</body>
</html>
