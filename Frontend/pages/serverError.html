<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoIt — Server Error</title>
  <link rel="stylesheet" href="../CSS/serverError.css" />
</head>

<body>

  <div class="page">

    <!-- RED HEADER -->
    <div class="hero-header">
      <div class="top-bar">
        <button class="icon-btn" id="backBtn" aria-label="Go back">
          <img src="../images/icons/left-arrow.svg" alt="back" />
        </button>
        <span class="page-title">Server error</span>
      </div>
    </div>

    <!-- ERROR BODY -->
    <div class="error-body">

      <!-- Server illustration icon -->
      <div class="error-icon">
        <img src="../images/icons/server.svg" alt="server error" />
      </div>

      <!-- 500 number — 5 is dark red, 00 is light pink -->
      <div class="error-code">
        <span class="code-dark">5</span>
        <span class="code-light">00</span>
      </div>

      <!-- Title & description -->
      <h1 class="error-title">Server error</h1>
      <p class="error-subtitle">
        Something went wrong on our end.
        We're working to fix it. Please try again.
      </p>

    </div>

  </div>

  <script src="../Javascript/serverError.js"></script>

</body>
</html>
