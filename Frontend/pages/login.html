<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoIt — Login</title>
  <link rel="stylesheet" href="../CSS/login.css" />
</head>

<body>

  <div class="auth-card">

    <!-- Red Header -->
    <div class="auth-header">
      <h1 class="auth-title">Welcome</h1>
      <p class="auth-subtitle">Sign in to your account</p>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="tab active">Login</button>
        <a href="register.html" class="tab">Register</a>
      </div>
    </div>

    <!-- Form Body -->
    <form class="auth-body" id="loginForm">

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrapper">
          <img src="../images/icons/email.png" class="input-icon-left" alt="email icon" />
          <input
            type="email"
            id="email"
            placeholder="shuvam@gmail.com"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <img src="../images/icons/lock.svg" class="input-icon-left" alt="lock icon" />
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
          />
          <img src="../images/icons/eye.svg" class="input-icon-right" id="eyeIcon" alt="show password" />
        </div>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Sign In Button -->
      <button type="submit" class="btn-signin" id="loginBtn">Sign In</button>

      <!-- Footer -->
      <p class="auth-footer">
        Don't have an account? <a href="register.html">Register</a>
      </p>

    </form>

  </div>

  <script src="../Javascript/login.js"></script>
</body>
</html>
